<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Slate</title>
    <script>
      // SPA fallback for GitHub Pages.
      // Encodes the requested path into a query string and redirects to the
      // app root, where the matching snippet in index.html restores the URL
      // before the SPA router boots.
      // Reference: github.com/rafgraph/spa-github-pages
      (function () {
        var pathSegmentsToKeep = 1; // /Slate is segment 1
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
