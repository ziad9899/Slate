<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090B" />
    <meta name="description" content="A focused builder for landing pages. Compose pages from polished sections, ship in minutes." />
    <title>Slate — Landing pages, drafted in minutes</title>
    <script>
      // SPA path-recovery (companion to public/404.html). Decodes the path
      // that was stashed in the query string and restores the real URL
      // before any React code runs. Reference: rafgraph/spa-github-pages
      (function () {
        if (location.search.indexOf('?/') !== 0) return;
        var decoded =
          location.pathname.slice(0, -1) +
          location.search.slice(2).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?') +
          location.hash;
        history.replaceState(null, null, decoded);
      })();
    </script>
    <script>
      // Anti-flicker: apply the persisted language direction before React mounts.
      (function () {
        try {
          var raw = localStorage.getItem('slate.lang.v1')
          if (!raw) return
          var lang = JSON.parse(raw).state && JSON.parse(raw).state.lang
          if (lang === 'ar') {
            document.documentElement.lang = 'ar'
            document.documentElement.dir = 'rtl'
          }
        } catch (e) { /* noop */ }
      })()
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
